# Prometheus scrape configuration for JñānaSetu (Module 8).
# The API exposes Prometheus text format at GET /api/v1/metrics, gated by
# the internal service token. Write the token to infra/monitoring/api_token
# (plain text, never commit) before starting the monitoring profile.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: "jnana-api"
    metrics_path: /api/v1/metrics
    static_configs:
      - targets: ["api:8080"]
    authorization:
      credentials_file: /etc/prometheus/api_token
    scrape_timeout: 10s

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
