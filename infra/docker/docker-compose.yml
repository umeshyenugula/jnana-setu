name: ai-knowledge-assistant

services:
  api:
    build:
      context: ../../services/api
      dockerfile: Dockerfile
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      APP_ENV: ${APP_ENV:-development}
      PORT: "8080"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:5174}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      SUPABASE_DB_URL: ${SUPABASE_DB_URL:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-http}
      EMBEDDING_WORKER_URL: ${EMBEDDING_WORKER_URL:-http://embeddings:8082}
      PROCESSING_WORKERS: ${PROCESSING_WORKERS:-2}
      CHUNK_TARGET_TOKENS: ${CHUNK_TARGET_TOKENS:-200}
      CHUNK_OVERLAP_TOKENS: ${CHUNK_OVERLAP_TOKENS:-35}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-llamacpp}
      LLAMA_CPP_BASE_URL: ${LLAMA_CPP_BASE_URL:-http://llm:8081}
      LLM_MODEL: ${LLM_MODEL:-qwen3-4b}
      LLM_MAX_CONCURRENT: ${LLM_MAX_CONCURRENT:-1}
    restart: unless-stopped
    depends_on:
      - embeddings
      - llm

  embeddings:
    build:
      context: ../../services/embeddings
      dockerfile: Dockerfile
    environment:
      EMBEDDING_MODEL_DIR: ${EMBEDDING_MODEL_DIR:-/models/all-MiniLM-L6-v2}
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-0}
    volumes:
      - embedding-models:/models
    restart: unless-stopped

  # Module 5: local llama.cpp server (Qwen3-4B GGUF). Private service network
  # only — no published ports. No restart-on-failure policy: a crash must be
  # investigated, not looped. Mount models dir read-only; weights are never
  # committed (see docs/MODULE5_INFERENCE.md).
  llm:
    image: ghcr.io/ggerganov/llama.cpp:server
    command:
      - -m
      - /models/llm/${LLM_MODEL_FILE:-qwen3-4b-Q4_K_M.gguf}
      - --host
      - 0.0.0.0
      - --port
      - "8081"
      - --ctx-size
      - ${LLM_CONTEXT_WINDOW:-4096}
      - --n-predict
      - ${LLM_MAX_OUTPUT_TOKENS:-512}
    environment:
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-0}
    volumes:
      - ./models/llm:/models/llm:ro
    expose:
      - "8081"
    restart: "no"

  prometheus:
    image: prom/prometheus:v2.53.0
    profiles: [monitoring]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ../../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../../monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ../../monitoring/api_token:/etc/prometheus/api_token:ro
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    profiles: [monitoring]
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ../../monitoring/grafana/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
      - ../../monitoring/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ../../monitoring/grafana-dashboard.json:/etc/grafana/dashboards/jnana-platform.json:ro
      - grafana-data:/var/lib/grafana
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.104.0
    profiles: [monitoring]
    command: ["--config=/etc/otel/otel-collector.yml"]
    ports:
      - "127.0.0.1:4318:4318"
    volumes:
      - ../../monitoring/otel-collector.yml:/etc/otel/otel-collector.yml:ro
    restart: unless-stopped

volumes:
  embedding-models:
  grafana-data:
