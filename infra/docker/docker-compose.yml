name: ai-knowledge-assistant

services:
  api:
    build:
      context: ../../services/api
      dockerfile: Dockerfile
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      APP_ENV: ${APP_ENV:-development}
      PORT: "8080"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:5174}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      SUPABASE_DB_URL: ${SUPABASE_DB_URL:-}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-}
      SUPABASE_JWT_ISSUER: ${SUPABASE_JWT_ISSUER:-}
      SUPABASE_JWT_AUDIENCE: ${SUPABASE_JWT_AUDIENCE:-authenticated}
      KNOWLEDGE_MAX_UPLOAD_MB: ${KNOWLEDGE_MAX_UPLOAD_MB:-10}
      EMBEDDING_WORKER_URL: ${EMBEDDING_WORKER_URL:-http://embeddings:8082}
      PROCESSING_WORKERS: ${PROCESSING_WORKERS:-2}
      PROCESSING_RELAY_INTERVAL_S: ${PROCESSING_RELAY_INTERVAL_S:-10}
      CHUNK_TARGET_TOKENS: ${CHUNK_TARGET_TOKENS:-200}
      CHUNK_OVERLAP_TOKENS: ${CHUNK_OVERLAP_TOKENS:-35}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-}
      RETRIEVAL_TOP_K: ${RETRIEVAL_TOP_K:-5}
      RETRIEVAL_MAX_TOP_K: ${RETRIEVAL_MAX_TOP_K:-20}
      RETRIEVAL_MIN_SIMILARITY: ${RETRIEVAL_MIN_SIMILARITY:-0.1}
      RETRIEVAL_MAX_EVIDENCE_TOKENS: ${RETRIEVAL_MAX_EVIDENCE_TOKENS:-4000}
      RETRIEVAL_EMBED_TIMEOUT_S: ${RETRIEVAL_EMBED_TIMEOUT_S:-30}
      LLAMA_CPP_BASE_URL: ${LLAMA_CPP_BASE_URL:-http://llm:8081}
      LLM_MODEL: ${LLM_MODEL:-qwen3-4b}
      LLM_REQUEST_TIMEOUT_S: ${LLM_REQUEST_TIMEOUT_S:-120}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.3}
      LLM_TOP_P: ${LLM_TOP_P:-0.9}
      LLM_MAX_CONCURRENT: ${LLM_MAX_CONCURRENT:-1}
      LLM_ENABLE_THINKING: ${LLM_ENABLE_THINKING:-false}
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-512}
      LLM_MAX_PROMPT_CHARS: ${LLM_MAX_PROMPT_CHARS:-12000}
      CHAT_MAX_MESSAGE_CHARS: ${CHAT_MAX_MESSAGE_CHARS:-2000}
      CHAT_HISTORY_LIMIT: ${CHAT_HISTORY_LIMIT:-10}
      CHAT_TOP_K: ${CHAT_TOP_K:-5}
      CHAT_MAX_PROMPT_CHARS: ${CHAT_MAX_PROMPT_CHARS:-8000}
      CHAT_FALLBACK_TEXT: ${CHAT_FALLBACK_TEXT:-}
      CHAT_RETENTION_DAYS: ${CHAT_RETENTION_DAYS:-90}
      CHAT_RATE_LIMIT_PER_MIN: ${CHAT_RATE_LIMIT_PER_MIN:-30}
      OBS_LOG_LEVEL: ${OBS_LOG_LEVEL:-info}
      OBS_HEALTH_TIMEOUT_S: ${OBS_HEALTH_TIMEOUT_S:-5}
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_ENDPOINT: ${OTEL_ENDPOINT:-http://otel-collector:4318}
      OTEL_SAMPLE_RATIO: ${OTEL_SAMPLE_RATIO:-0.1}
    restart: unless-stopped
    depends_on:
      - embeddings
      - llm

  # Frontend: admin dashboard (Vite build args baked at image build time).
  dashboard:
    build:
      context: ../../apps/admin-dashboard
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${DASHBOARD_API_BASE_URL:-http://localhost:8080}
        VITE_SUPABASE_URL: ${SUPABASE_URL:-}
        VITE_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
        VITE_WIDGET_HOST: ${WIDGET_HOST:-http://localhost:5174}
    ports:
      - "127.0.0.1:5173:80"
    restart: unless-stopped

  # Frontend: embeddable chat widget + loader.js host.
  widget:
    build:
      context: ../../apps/chat-widget
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${WIDGET_API_BASE_URL:-http://localhost:8080}
    ports:
      - "127.0.0.1:5174:80"
    restart: unless-stopped

  embeddings:
    build:
      context: ../../services/embeddings
      dockerfile: Dockerfile
    environment:
      EMBEDDING_MODEL_DIR: ${EMBEDDING_MODEL_DIR:-/models/all-MiniLM-L6-v2}
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-0}
    volumes:
      - embedding-models:/models
    restart: unless-stopped

  # Module 5: local llama.cpp server (Qwen3-4B GGUF). Private service network
  # only — no published ports. No restart-on-failure policy: a crash must be
  # investigated, not looped. Mount models dir read-only; weights are never
  # committed (see docs/MODULE5_INFERENCE.md).
  llm:
    image: ghcr.io/ggerganov/llama.cpp:server
    command:
      - -m
      - /models/llm/${LLM_MODEL_FILE:-qwen3-4b-Q4_K_M.gguf}
      - --host
      - 0.0.0.0
      - --port
      - "8081"
      - --ctx-size
      - ${LLM_CONTEXT_WINDOW:-4096}
      - --n-predict
      - ${LLM_MAX_OUTPUT_TOKENS:-512}
    environment:
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-0}
    volumes:
      - ../../models/llm:/models/llm:ro
    expose:
      - "8081"
    restart: "no"

  prometheus:
    image: prom/prometheus:v2.53.0
    profiles: [monitoring]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ../../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../../monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ../../monitoring/api_token:/etc/prometheus/api_token:ro
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    profiles: [monitoring]
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ../../monitoring/grafana/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
      - ../../monitoring/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ../../monitoring/grafana-dashboard.json:/etc/grafana/dashboards/jnana-platform.json:ro
      - grafana-data:/var/lib/grafana
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.104.0
    profiles: [monitoring]
    command: ["--config=/etc/otel/otel-collector.yml"]
    ports:
      - "127.0.0.1:4318:4318"
    volumes:
      - ../../monitoring/otel-collector.yml:/etc/otel/otel-collector.yml:ro
    restart: unless-stopped

volumes:
  embedding-models:
  grafana-data:
